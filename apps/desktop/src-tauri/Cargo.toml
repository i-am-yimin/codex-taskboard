[package]
name = "codex-taskboard-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
rand = "0.8"
serde_json = "1"
tauri-plugin-single-instance = "2"

[features]
acceptance-probes = []

[[example]]
name = "codex-native-probe"
required-features = ["acceptance-probes"]

# Add inside the existing HTTPS server {} block for your Taskboard domain.
# OpenResty runs on the Docker host; configure certificates in that server block.
location / {
    proxy_pass http://127.0.0.1:47830;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite incoming forwarding headers: this is the one trusted proxy hop.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";

    # Taskboard uses Server-Sent Events for live task updates.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no always;
    client_max_body_size 2m;
}

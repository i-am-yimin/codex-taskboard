name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing maintainer-created tag, for example v0.1.0
        required: true
permissions:
  contents: read
jobs:
  validate:
    if: github.actor == 'i-am-yimin'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          export RELEASE_SHA="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json")).version; if (process.env.RELEASE_TAG !== `v${version}` || !/^v\d+\.\d+\.\d+(-[a-zA-Z0-9.-]+)?$/.test(process.env.RELEASE_TAG)) process.exit(1); fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${process.env.RELEASE_TAG}\nversion=${version}\nsha=${process.env.RELEASE_SHA}\n`);'
  release-gate:
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: taskboard
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: taskboard_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U taskboard" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://taskboard:test-only-password@127.0.0.1:5432/taskboard_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm exec tsx scripts/check-production.ts
      - run: pnpm test:e2e
      - run: pnpm test:offline
      - run: pnpm audit --prod --audit-level high
  windows:
    needs: [validate, release-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm desktop:prepare
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm desktop:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  linux:
    needs: [validate, release-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Exercise isolated Compose deployment and restore
        run: bash scripts/check-deployment.sh
      - name: Exercise isolated internal-CA HTTPS deployment
        run: bash scripts/check-https-deployment.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployment-diagnostics
          path: |
            .artifacts/deployment-test-*/compose-ps.log
            .artifacts/deployment-test-*/compose.log
          if-no-files-found: ignore
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: https-deployment-diagnostics
          path: |
            .artifacts/https-test-*/compose.log
            .artifacts/https-test-*/app-health.json
          if-no-files-found: ignore
          include-hidden-files: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: ghcr.io/i-am-yimin/codex-taskboard:${{ needs.validate.outputs.version }}
          outputs: type=docker,dest=/tmp/taskboard-linux-amd64.tar
      - uses: anchore/sbom-action@v0
        with:
          image: docker-archive:/tmp/taskboard-linux-amd64.tar
          format: spdx-json
          output-file: /tmp/taskboard.spdx.json
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: linux-image
          path: |
            /tmp/taskboard-linux-amd64.tar
            /tmp/taskboard.spdx.json
  draft:
    needs: [validate, release-gate, windows, linux]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum *.exe *.tar *.json > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --title "Codex Taskboard $RELEASE_TAG" --notes-file docs/release-notes.md

name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: taskboard
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: taskboard_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U taskboard" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://taskboard:test-only-password@127.0.0.1:5432/taskboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm exec tsx scripts/check-production.ts
      - run: pnpm test:e2e
      - run: pnpm test:offline
      - run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            playwright-report
            test-results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
      - name: Exercise isolated Compose deployment and restore
        run: bash scripts/check-deployment.sh
      - name: Exercise isolated internal-CA HTTPS deployment
        run: bash scripts/check-https-deployment.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployment-diagnostics
          path: |
            .artifacts/deployment-test-*/compose-ps.log
            .artifacts/deployment-test-*/compose.log
          if-no-files-found: ignore
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: https-deployment-diagnostics
          path: |
            .artifacts/https-test-*/compose.log
            .artifacts/https-test-*/app-health.json
          if-no-files-found: ignore
          include-hidden-files: true
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm desktop:prepare
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: pnpm desktop:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-ci
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

name: Publish server image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.actor == 'i-am-yimin'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Pin the image to this source commit
        run: |
          echo "tag=server-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Validate managed first-run deployment before publishing
        run: bash scripts/check-openresty-deployment.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/i-am-yimin/codex-taskboard:${{ steps.image.outputs.tag }}
          provenance: mode=max
          sbom: true
      - name: Record the deployable reference
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "TASKBOARD_VERSION=$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/i-am-yimin/codex-taskboard@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

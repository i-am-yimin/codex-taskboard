name: Publish server image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-server-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor == 'i-am-yimin' && startsWith(github.ref, 'refs/tags/vserver-')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Read the independent server release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/server-image-metadata.mjs "$RELEASE_TAG" "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing server version
        env:
          IMAGE: ghcr.io/i-am-yimin/codex-taskboard:${{ steps.image.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /tmp/image-check.log 2>&1; then
            echo "Server version already published: $IMAGE" >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|not found|NAME_UNKNOWN|MANIFEST_UNKNOWN' /tmp/image-check.log; then
            cat /tmp/image-check.log >&2
            exit 1
          fi
      - name: Validate managed first-run deployment before publishing
        run: bash scripts/check-openresty-deployment.sh
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/i-am-yimin/codex-taskboard:${{ steps.image.outputs.tag }}
            ghcr.io/i-am-yimin/codex-taskboard:${{ steps.image.outputs.commit-tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record the deployable reference
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          COMMIT_TAG: ${{ steps.image.outputs.commit-tag }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "TASKBOARD_VERSION=$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Source reference: ghcr.io/i-am-yimin/codex-taskboard:$COMMIT_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/i-am-yimin/codex-taskboard@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
